# OpenMAIC Docker Compose 配置
# 使用外部 PostgreSQL 和 Redis 容器（已连接到 openmaic-business_default 网络）
# 启动命令: docker compose up -d

services:
  # Python 后端服务
  python-server:
    build:
      context: ./packages/server-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped  # 自动重启策略
    environment:
      - DATABASE_URL=postgres://postgres:0okm9ijn@postgres:5432/postgres
      - REDIS_URL=redis://:re2019@redis:6379
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=true
      - TESTING_MODE=true
      # LLM 提供商 - 阿里云 DashScope
      - OPENAI_API_KEY=sk-8534df2141cc4c548e30097ae52511b2
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen3.6-plus}
      - HTTP_PROXY=  # 禁用代理（DashScope直接访问）
      # TTS - 阿里云百炼 DashScope 兼容模式 API
      - TTS_API_KEY=${TTS_API_KEY:-sk-8534df2141cc4c548e30097ae52511b2}
      - TTS_API_BASE=${TTS_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      # 阿里云 OSS
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      # OAuth
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      # CORS - 开发模式允许所有来源
      - ALLOWED_ORIGINS=["http://localhost:3030","http://localhost:3031","http://localhost:3000","http://localhost:3001","http://localhost:3003","http://localhost:8081","http://localhost:8082","http://localhost:19000","http://localhost:19006"]
      # MAIC-UI 服务配置（交互式内容生成）
      - MAIC_UI_URL=http://host.docker.internal:8927
      - MAIC_UI_ENABLED=true
      - MAIC_UI_SERVICE_TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwiZXhwIjoxODEwODg0OTkyLCJ0eXBlIjoiYWNjZXNzIn0.SK9LKP1SSPJ9FthLSAi6_gBkfiOzo0zRyR5rjPJRk5k
    volumes:
      - ./packages/server-python/app:/app/app  # 开发时热重载（去掉 :ro，watchfiles 需要可写才能检测变化）
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--timeout-keep-alive", "300"]
    extra_hosts:
      - "postgres:host-gateway"
      - "redis:host-gateway"

  # 原有 Next.js Web 应用（保留）
  openmaic-web:
    build: .
    ports:
      - "3030:3030"
    env_file:
      - .env.local
    environment:
      - API_BASE_URL=http://python-server:8000
    volumes:
      - openmaic-data:/app/data
    restart: unless-stopped
    profiles:
      - web
    depends_on:
      - python-server

  # Admin Dashboard
  admin:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://python-server:8000
    depends_on:
      - python-server
    profiles:
      - admin

  # Website 官网
  website:
    build:
      context: .
      dockerfile: packages/website/Dockerfile
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://python-server:8000
      - NEXT_PUBLIC_MAIN_APP_URL=http://localhost:3031
    depends_on:
      - python-server
    profiles:
      - web
      - main

  # Main Project 主应用
  main:
    build:
      context: .
      dockerfile: packages/main-project/Dockerfile
    ports:
      - "3031:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://python-server:8000
    depends_on:
      - python-server
    profiles:
      - main

volumes:
  openmaic-data:
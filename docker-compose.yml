version: '3.8'

services:
  # Python 后端服务（新）
  python-server:
    build:
      context: ./packages/server-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://maic:password@postgres:5432/maic
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=true
      # LLM 提供商
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-openai:gpt-4o}
      # 阿里云 OSS
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      # OAuth
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      # CORS
      - ALLOWED_ORIGINS=["http://localhost:3030","http://localhost:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./packages/server-python/app:/app/app:ro  # 开发时热重载

  # PostgreSQL 数据库（新）
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: maic
      POSTGRES_USER: maic
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maic -d maic"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 缓存（新）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 原有 Next.js Web 应用（保留）
  openmaic-web:
    build: .
    ports:
      - "3030:3030"
    env_file:
      - .env.local
    environment:
      - API_BASE_URL=http://python-server:8000
    volumes:
      - openmaic-data:/app/data
    restart: unless-stopped
    profiles:
      - web  # 使用 docker compose --profile web up 启动
    depends_on:
      - python-server

volumes:
  pgdata:
  redisdata:
  openmaic-data:
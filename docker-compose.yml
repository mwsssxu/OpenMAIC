# OpenMAIC Docker Compose 配置
# 使用外部 redis 和 postgres 容器（已存在于 openmaic_default 网络）

services:
  # Python 后端服务
  python-server:
    build:
      context: ./packages/server-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:0okm9ijn@postgres:5432/postgres
      - REDIS_URL=redis://:re2019@redis:6379
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=true
      # LLM 提供商
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-openai:gpt-4o}
      # 阿里云 OSS
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      # OAuth
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      # CORS
      - ALLOWED_ORIGINS=["http://localhost:3030","http://localhost:3000"]
    volumes:
      - ./packages/server-python/app:/app/app:ro  # 开发时热重载
    extra_hosts:
      - "postgres:host-gateway"
      - "redis:host-gateway"

  # 原有 Next.js Web 应用（保留）
  openmaic-web:
    build: .
    ports:
      - "3030:3030"
    env_file:
      - .env.local
    environment:
      - API_BASE_URL=http://python-server:8000
    volumes:
      - openmaic-data:/app/data
    restart: unless-stopped
    profiles:
      - web
    depends_on:
      - python-server

  # Admin Dashboard
  admin:
    build:
      context: ./packages/admin
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://python-server:8000
    depends_on:
      - python-server
    profiles:
      - admin

  # Main Project
  main:
    build:
      context: ./packages/main-project
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://python-server:8000
    depends_on:
      - python-server
    profiles:
      - main

volumes:
  openmaic-data:
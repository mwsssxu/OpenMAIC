# OpenMAIC Docker Compose 配置
# 使用外部 PostgreSQL 和 Redis 容器（已连接到 openmaic-business_default 网络）
# 启动命令: docker compose up -d

services:
  # Python 后端服务
  python-server:
    build:
      context: ./packages/server-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:0okm9ijn@postgres:5432/postgres
      - REDIS_URL=redis://:re2019@redis:6379
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=true
      - TESTING_MODE=true
      # LLM 提供商 - 阿里云百炼
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-sp-359fa096d7144a5da564f9af9c73abaf}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://coding.dashscope.aliyuncs.com/v1}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-openai/qwen3.6-plus}
      # TTS - 阿里云百炼 (DashScope compatible-mode)
      - TTS_API_KEY=${TTS_API_KEY:-sk-0ad9501ce2d748549007958344430681}
      - TTS_API_BASE=${TTS_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-Qwen3 TTS Flash}
      # 阿里云 OSS
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      # OAuth
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      # CORS - 开发模式允许所有来源
      - ALLOWED_ORIGINS=["http://localhost:3030","http://localhost:3031","http://localhost:3000","http://localhost:3001","http://localhost:3003","http://localhost:8081","http://localhost:8082","http://localhost:19000","http://localhost:19006"]
    volumes:
      - ./packages/server-python/app:/app/app:ro  # 开发时热重载
    extra_hosts:
      - "postgres:host-gateway"
      - "redis:host-gateway"

  # 原有 Next.js Web 应用（保留）
  openmaic-web:
    build: .
    ports:
      - "3030:3030"
    env_file:
      - .env.local
    environment:
      - API_BASE_URL=http://python-server:8000
    volumes:
      - openmaic-data:/app/data
    restart: unless-stopped
    profiles:
      - web
    depends_on:
      - python-server

  # Admin Dashboard
  admin:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://python-server:8000
    depends_on:
      - python-server
    profiles:
      - admin

  # Website 官网
  website:
    build:
      context: .
      dockerfile: packages/website/Dockerfile
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://python-server:8000
      - NEXT_PUBLIC_MAIN_APP_URL=http://localhost:3031
    depends_on:
      - python-server
    profiles:
      - web
      - main

  # Main Project 主应用
  main:
    build:
      context: .
      dockerfile: packages/main-project/Dockerfile
    ports:
      - "3031:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://python-server:8000
    depends_on:
      - python-server
    profiles:
      - main

volumes:
  openmaic-data:
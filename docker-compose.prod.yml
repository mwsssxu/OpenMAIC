version: '3.8'

# 生产环境 Docker Compose 配置
# 与 docker-compose.yml 合并使用

services:
  python-server:
    environment:
      - DEBUG=false
      - TESTING_MODE=false
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always
    # 生产环境建议使用外部数据库服务

  redis:
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  admin:
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  main:
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - python-server
      - admin
      - main
    restart: always
    profiles:
      - production

volumes:
  # 生产环境建议使用持久化存储或云存储
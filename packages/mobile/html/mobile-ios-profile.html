<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人资料 - iOS</title>
  <style>
    :root {
      --bg:      linear-gradient(165deg, oklch(97% 0.008 30) 0%, oklch(95% 0.012 40) 50%, oklch(96% 0.01 55) 100%);
      --bg-solid: oklch(96% 0.01 40);
      --surface: oklch(100% 0 0 / 0.55);
      --surface-solid: oklch(100% 0 0);
      --fg:      oklch(12% 0.015 30);
      --muted:   oklch(42% 0.015 30);
      --border:  oklch(94% 0.005 30 / 0.6);
      --accent:  oklch(58% 0.16 30);
      --accent-light: oklch(94% 0.025 40);
      --secondary: oklch(60% 0.10 175);
      --secondary-light: oklch(94% 0.02 175);

      --font-display: 'Söhne', 'Avenir Next', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;

      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    .phone-frame {
      width: 390px; height: 844px;
      background: #1a1a1a; border-radius: 54px;
      padding: 12px; position: relative;
      box-shadow: 0 24px 48px rgba(0,0,0,0.3), 0 0 0 2px #333;
      margin: 24px auto; font-family: var(--font-body);
    }
    .phone-screen {
      width: 100%; height: 100%;
      background: var(--bg-solid); border-radius: 44px;
      overflow: hidden; position: relative;
    }
    .dynamic-island {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 126px; height: 36px; background: #1a1a1a; border-radius: 20px; z-index: 100;
    }

    .status-bar {
      height: 54px; display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 28px 8px; font-size: 14px; font-weight: 600; color: var(--fg);
      position: relative; z-index: 10;
    }
    .status-icons { display: flex; gap: 6px; align-items: center; }

    .nav-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px var(--space-md) var(--space-sm);
      position: relative; z-index: 10;
    }
    .nav-title {
      font-family: var(--font-display); font-size: 17px; font-weight: 600;
      letter-spacing: -0.015em;
    }
    .nav-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: oklch(100% 0 0 / 0.5); border: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--fg); cursor: pointer;
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      backdrop-filter: blur(16px) saturate(150%);
    }
    .nav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Content */
    .app-content {
      position: relative; z-index: 1;
      height: calc(100% - 54px - 44px - 83px);
      overflow-y: auto; overflow-x: hidden;
      padding: 0 var(--space-md) var(--space-md);
      -webkit-overflow-scrolling: touch;
    }

    /* Profile Header */
    .profile-header {
      text-align: center; padding: var(--space-md) 0 var(--space-lg);
    }

    /* Cartoon Avatar */
    .avatar-large {
      width: 88px; height: 88px; margin: 0 auto var(--space-sm);
      position: relative;
    }
    .avatar-large svg { width: 88px; height: 88px; }

    .profile-name {
      font-family: var(--font-display); font-size: 20px; font-weight: 700;
      letter-spacing: -0.02em; margin-bottom: 2px;
    }
    .profile-bio {
      font-size: 13px; color: var(--muted); line-height: 1.4; margin-bottom: var(--space-sm);
    }
    .profile-level {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px; border-radius: 14px;
      background: linear-gradient(135deg, oklch(55% 0.14 85) 0%, oklch(58% 0.16 30) 100%);
      color: white; font-size: 12px; font-weight: 600;
    }

    /* Stats Row */
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: var(--space-sm); margin-bottom: var(--space-lg);
    }
    .stat-card {
      background: var(--surface);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-sm);
      text-align: center;
    }
    .stat-value {
      font-family: var(--font-display); font-size: 22px; font-weight: 700;
      letter-spacing: -0.03em; line-height: 1.1;
    }
    .stat-value.coral { color: oklch(58% 0.16 30); }
    .stat-value.mint  { color: oklch(52% 0.10 175); }
    .stat-value.gold  { color: oklch(55% 0.14 85); }
    .stat-label {
      font-size: 11px; color: var(--muted); margin-top: 2px;
    }

    /* Section Title */
    .section-title {
      font-family: var(--font-display); font-size: 15px; font-weight: 600;
      margin-bottom: var(--space-sm); letter-spacing: -0.01em;
    }

    /* Achievements */
    .achievements-scroll {
      display: flex; gap: var(--space-sm); overflow-x: auto;
      padding-bottom: var(--space-sm); margin-bottom: var(--space-lg);
      -webkit-overflow-scrolling: touch;
    }
    .achievement {
      width: 80px; text-align: center; flex-shrink: 0;
    }
    .achievement-icon {
      width: 56px; height: 56px; border-radius: 50%; margin: 0 auto var(--space-xs);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .achievement-icon.earned { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .achievement-icon.locked { opacity: 0.35; }
    .achievement-icon svg { width: 28px; height: 28px; }
    .achievement-icon.earned.coral { background: linear-gradient(135deg, oklch(92% 0.04 30), oklch(88% 0.06 30)); }
    .achievement-icon.earned.mint  { background: linear-gradient(135deg, oklch(92% 0.04 175), oklch(88% 0.06 175)); }
    .achievement-icon.earned.gold  { background: linear-gradient(135deg, oklch(92% 0.05 85), oklch(88% 0.07 85)); }
    .achievement-icon.earned.blue  { background: linear-gradient(135deg, oklch(92% 0.04 240), oklch(88% 0.06 240)); }
    .achievement-icon.locked { background: var(--border); }
    .achievement-name { font-size: 10px; color: var(--muted); line-height: 1.2; }

    /* Settings List */
    .settings-list {
      background: var(--surface);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: var(--space-lg);
    }
    .settings-item {
      display: flex; align-items: center; gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      min-height: 44px; cursor: pointer;
      border-bottom: 0.5px solid var(--border);
      transition: background 0.15s;
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-item:active { background: var(--accent-light); }
    .settings-icon {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .settings-icon svg { width: 16px; height: 16px; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .settings-icon.coral { background: oklch(92% 0.04 30); color: oklch(55% 0.16 30); }
    .settings-icon.mint  { background: oklch(92% 0.04 175); color: oklch(52% 0.10 175); }
    .settings-icon.gold  { background: oklch(92% 0.05 85); color: oklch(55% 0.14 85); }
    .settings-icon.blue  { background: oklch(92% 0.04 240); color: oklch(52% 0.12 250); }
    .settings-icon.purple{ background: oklch(92% 0.04 310); color: oklch(52% 0.12 310); }
    .settings-text { flex: 1; font-size: 14px; }
    .settings-chevron { color: var(--muted); opacity: 0.5; }
    .settings-chevron svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .settings-badge {
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      background: var(--accent); color: white; font-weight: 600;
    }

    /* Weekly Study Chart */
    .weekly-card {
      background: var(--surface);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .weekly-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: var(--space-sm);
    }
    .weekly-header h3 { font-size: 15px; font-weight: 600; }
    .weekly-header span { font-size: 12px; color: var(--accent); }
    .weekly-chart {
      display: flex; align-items: flex-end; gap: 6px; height: 80px;
    }
    .weekly-bar {
      flex: 1; border-radius: 4px 4px 0 0;
      background: var(--accent-light);
      position: relative;
      min-height: 8px;
    }
    .weekly-bar.active { background: var(--accent); }
    .weekly-bar.today { background: linear-gradient(180deg, var(--accent), oklch(50% 0.13 40)); }
    .weekly-label {
      display: flex; justify-content: space-around;
      margin-top: 4px;
    }
    .weekly-label span {
      flex: 1; text-align: center; font-size: 10px; color: var(--muted);
    }

    /* Bottom Tab Bar */
    .tab-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 83px;
      background: oklch(100% 0 0 / 0.72);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      backdrop-filter: blur(32px) saturate(200%);
      border-top: 0.5px solid var(--border);
      display: flex; justify-content: space-around; align-items: flex-start;
      padding-top: 8px;
    }
    .tab-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-width: 64px; min-height: 44px; color: var(--muted);
    }
    .tab-item.active { color: var(--accent); }
    .tab-icon { font-size: 22px; }
    .tab-label { font-size: 10px; font-weight: 500; letter-spacing: 0.005em; }
    .home-indicator {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; background: var(--fg);
      border-radius: 3px; opacity: 0.2;
    }

    .scroll-spacer { height: 16px; }
  </style>
</head>

    <div class="phone-screen">

        </div>
      </nav>

      <!-- Content -->
      <div class="app-content">
        <!-- Profile Header with Cartoon Avatar -->
        <div class="profile-header">
          <div class="avatar-large">
            <!-- Cartoon person avatar -->
            <svg viewBox="0 0 100 100" fill="none">
              <!-- Background circle -->
              <circle cx="50" cy="50" r="46" fill="oklch(58% 0.16 30)"/>

              <path d="M28 42 Q28 22 50 20 Q72 22 72 42" fill="oklch(20% 0.02 30)"/>

          <div class="settings-item">

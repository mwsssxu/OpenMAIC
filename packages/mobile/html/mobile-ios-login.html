<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - iOS</title>
  <style>
    :root {
      --bg:      linear-gradient(165deg, oklch(97% 0.008 30) 0%, oklch(95% 0.012 40) 50%, oklch(96% 0.01 55) 100%);
      --bg-solid: oklch(96% 0.01 40);
      --surface: oklch(100% 0 0 / 0.55);
      --surface-solid: oklch(100% 0 0);
      --fg:      oklch(12% 0.015 30);
      --muted:   oklch(42% 0.015 30);
      --border:  oklch(94% 0.005 30 / 0.6);
      --accent:  oklch(58% 0.16 30);
      --accent-light: oklch(94% 0.025 40);
      --secondary: oklch(60% 0.10 175);
      --secondary-light: oklch(94% 0.02 175);

      --font-display: 'Söhne', 'Avenir Next', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;

      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 20px;
      --space-xl: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* iPhone Frame */
    .phone-frame {
      width: 390px;
      height: 844px;
      background: #1a1a1a;
      border-radius: 54px;
      padding: 12px;
      position: relative;
      box-shadow: 0 24px 48px rgba(0,0,0,0.3), 0 0 0 2px #333;
      margin: 24px auto;
      font-family: var(--font-body);
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      position: relative;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 36px;
      background: #1a1a1a;
      border-radius: 20px;
      z-index: 100;
    }

    /* Status Bar */
    .status-bar {
      height: 54px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
    }

    .status-time {
      font-variant-numeric: tabular-nums;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Login Content */
    .login-content {
      height: calc(100% - 54px - 34px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 var(--space-lg) var(--space-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Hero Illustration Area */
    .hero-illustration {
      width: 100%;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-lg);
      position: relative;
    }

    .hero-illustration svg {
      width: 200px;
      height: auto;
    }

    /* Floating shapes */
    .float-shape {
      position: absolute;
      animation: float 3s ease-in-out infinite;
    }

    .float-shape:nth-child(2) { animation-delay: -0.8s; }
    .float-shape:nth-child(3) { animation-delay: -1.6s; }
    .float-shape:nth-child(4) { animation-delay: -2.4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    /* Brand */
    .brand-area {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin-bottom: 6px;
    }

    .brand-tagline {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* Form */
    .login-form {
      width: 100%;
      max-width: 320px;
    }

    .input-group {
      margin-bottom: var(--space-md);
    }

    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .input-field {
      width: 100%;
      height: 50px;
      padding: 0 var(--space-md);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-solid);
      font-size: 16px;
      font-family: var(--font-body);
      color: var(--fg);
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px oklch(58% 0.16 30 / 0.12);
    }

    .input-field::placeholder {
      color: oklch(75% 0.008 30);
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon .input-field {
      padding-right: 48px;
    }

    .input-icon-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.15s;
    }

    .input-icon-btn:active {
      background: var(--accent-light);
    }

    /* Forgot password */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: var(--space-lg);
    }

    .forgot-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:active {
      opacity: 0.7;
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--accent) 0%, oklch(50% 0.13 40) 100%);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      font-family: var(--font-display);
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px oklch(58% 0.16 30 / 0.25);
      margin-bottom: var(--space-lg);
    }

    .login-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px oklch(58% 0.16 30 / 0.2);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
      width: 100%;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Social Login */
    .social-login {
      display: flex;
      gap: var(--space-lg);
      justify-content: center;
      margin-bottom: var(--space-xl);
    }

    .social-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface-solid);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .social-btn:active {
      transform: scale(0.94);
      border-color: var(--accent);
    }

    .social-btn svg {
      width: 24px;
      height: 24px;
    }

    /* Sign up link */
    .signup-row {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .signup-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    /* Terms */
    .terms-text {
      font-size: 11px;
      color: oklch(65% 0.008 30);
      text-align: center;
      margin-top: var(--space-md);
      line-height: 1.6;
    }

    .terms-text a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: oklch(20% 0.015 30 / 0.25);
      border-radius: 3px;
    }

    /* Back button */
    .back-btn {
      position: absolute;
      top: 60px;
      left: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      backdrop-filter: blur(16px) saturate(150%);
      border: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      color: var(--fg);
      transition: transform 0.15s;
    }

    .back-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password-input');
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }
  </script>
</body>
